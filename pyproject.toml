[project]
name = "research-assistant-ai"
version = "0.1.0"
description = "Agentic AI research assistant with LangGraph workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Backend
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    # Frontend
    "streamlit>=1.49.0",
    # Configuration
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    # HTTP
    "httpx>=0.28.1",
    # LangChain / LangGraph
    "langchain>=0.3.27",
    "langgraph>=0.6.6",
    "langchain-core>=0.3.74",
    "langchain-community>=0.3.27",
    # LLM Provider
    "langchain-groq>=0.3.8",
    # Search & Retrieval
    "tavily-python>=0.7.11",
    "arxiv>=2.2.0",
    # Embeddings & Vector Store
    "sentence-transformers>=5.1.0",
    "faiss-cpu>=1.12.0",
    # Document Processing
    "pypdf>=6.0.0",
    # Utilities
    "python-multipart>=0.0.20",
    #database
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.4",
    #streaming
    "sse-starlette>=3.4.6",
    "sseclient>=0.0.27",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.12.11",
    "black>=25.1.0",
    "mypy>=1.18.2",
    "pytest-cov>=7.1.0",
]
